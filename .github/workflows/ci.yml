name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    # Um teste de PTY travado não pode segurar o job pelas 6 h padrão.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Tauri e depuradores (Linux)
        if: runner.os == 'Linux'
        run: |
          # O lldb do Ubuntu 22.04 (14) ainda não tem o lldb-dap: vem do repositório oficial do LLVM.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lldb-21
          # Sem netcoredbg: o 3.2 exige glibc 2.38, e o Ubuntu 22.04 tem a 2.35 (o teste dele é pulado).

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npx prettier --check src
      - run: npm run build
      - run: npx ng test --watch=false
      - run: node --test .github/scripts/latest-json.test.mjs
