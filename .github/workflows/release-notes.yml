# Publicar ou editar um release refaz o latest.json dele, com o texto atual como notas da atualização.
name: Notas da atualização

on:
  release:
    types: [published, edited]

permissions:
  contents: write

# Publicar pode disparar os dois tipos de uma vez: um envio espera o outro.
concurrency: latest-json-${{ github.event.release.tag_name }}

jobs:
  latest-json:
    if: ${{ !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      # O script do main, não o da tag: releases antigos usam a versão corrigida.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: node .github/scripts/latest-json.mjs "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
